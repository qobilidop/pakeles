[package]
name = "pakeles-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "The pakeles CLI: core toolchain commands plus the per-incumbent diff gates"

# The user-facing binary keeps the toolchain's name.
[[bin]]
name = "pakeles"
path = "src/main.rs"

[[bin]]
name = "gen_examples"
path = "src/bin/gen_examples.rs"
required-features = ["symex"]

[[bin]]
name = "symex_bench"
path = "src/bin/symex_bench.rs"
required-features = ["symex"]

[features]
default = ["symex"]
symex = ["pakeles/symex"]

[dependencies]
pakeles = { path = "../pakeles", default-features = false }
pakeles-example-linux-flow-dissector = { path = "../../examples/real_world/linux_flow_dissector" }
pakeles-example-dpdk-ptype = { path = "../../examples/real_world/dpdk_ptype" }
pakeles-example-katran-flow = { path = "../../examples/real_world/katran_flow" }
pakeles-example-sai-parser = { path = "../../examples/real_world/sai_parser" }
pakeles-example-tls-clienthello = { path = "../../examples/real_world/tls_clienthello" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"

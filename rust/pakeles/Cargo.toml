[package]
name = "pakeles"
version = "0.1.0"
edition = "2021"
description = "A serializable IR for wire-format parsers — one description, many provably-agreeing artifacts"
license = "Apache-2.0"
repository = "https://github.com/qobilidop/pakeles"
readme = "../../README.md"
keywords = ["parser", "packet", "network", "ir", "wireshark"]
categories = ["parsing", "network-programming"]
# src/** is self-contained for packaging: the generated-protobuf code
# is vendored (src/gen/, so consumers never need protoc). Test-only
# fixtures load by path from the repo-root testdata/ tree.
include = ["src/**", "Cargo.toml"]

# The incumbent-agnostic CLI ships with the crate (its commands know
# nothing about the gallery's incumbents — each example crate carries
# its own diff binary). Library consumers: default-features = false.
[[bin]]
name = "pakeles"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
prost = "0.13"
pbjson = "0.7"
pbjson-types = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
pcap-parser = "0.16"
libc = "0.2"
tempfile = "3"
z3 = { version = "0.12", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["symex", "cli"]
symex = ["dep:z3"]
cli = ["dep:clap"]

[dev-dependencies]
pakeles-testkit = { path = "../pakeles-testkit" }

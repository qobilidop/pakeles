name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Same image dev.sh builds. Fast path: pull the prebuilt copy
      # dev-image.yml publishes, keyed by the content hash of
      # .devcontainer/** — so this checkout's exact environment, or
      # nothing. A miss (a PR editing .devcontainer, or the package not
      # public yet) falls through to building locally, same as before.
      - name: Pull prebuilt dev image
        id: prebuilt
        run: |
          ref="ghcr.io/${{ github.repository }}/dev:env-${{ hashFiles('.devcontainer/**') }}"
          if docker pull "$ref"; then
            docker tag "$ref" pakeles-dev
            echo "hit=true" >>"$GITHUB_OUTPUT"
          else
            echo "hit=false" >>"$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.prebuilt.outputs.hit != 'true'

      - name: Build dev image (prebuilt miss)
        if: steps.prebuilt.outputs.hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          tags: pakeles-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restore cargo caches
        uses: actions/cache@v4
        with:
          path: |
            .ci/cargo-registry
            .ci/target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-

      # Mirrors dev.sh mounts, with host dirs standing in for its volumes.
      # gen_vectors regenerates the gitignored conformance suites from
      # the committed IRs before testing — without it, every
      # backend-conformance test would silently skip on a fresh
      # checkout. It writes ONLY conformance/vectors.*; the committed
      # gen/ artifacts stay untouched so their equality guards keep
      # comparing committed against fresh. Release profile: the big
      # suites (linux_flow_dissector, dpdk_ptype) are symex-bound and
      # several times slower in debug.
      - name: Gate
        run: |
          mkdir -p .ci/cargo-registry .ci/target
          docker run --rm \
            -v "$PWD":/work -w /work \
            -v "$PWD/.ci/target":/target \
            -v "$PWD/.ci/cargo-registry":/usr/local/cargo/registry \
            pakeles-dev \
            sh -c 'cargo fmt --check && cargo clippy --workspace --all-targets -- -D warnings && cargo run --release --quiet --bin gen_vectors && cargo test --workspace && buf lint && ruff check . && pyright && cd python && pytest'

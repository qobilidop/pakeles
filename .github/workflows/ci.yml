name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same image dev.sh builds. Fast path: pull the prebuilt copy
      # dev-image.yml publishes, keyed by the content hash of
      # .devcontainer/** — so this checkout's exact environment, or
      # nothing. A miss (a PR editing .devcontainer, or the package not
      # public yet) falls through to building locally, same as before.
      - name: Pull prebuilt dev image
        id: prebuilt
        run: |
          ref="ghcr.io/${{ github.repository }}/dev:env-${{ hashFiles('.devcontainer/**') }}"
          if docker pull "$ref"; then
            docker tag "$ref" pakeles-dev
            echo "hit=true" >>"$GITHUB_OUTPUT"
          else
            echo "hit=false" >>"$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.prebuilt.outputs.hit != 'true'

      - name: Build dev image (prebuilt miss)
        if: steps.prebuilt.outputs.hit != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .devcontainer
          tags: pakeles-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restore cargo caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .ci/cargo-registry
            .ci/target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-

      # Mirrors dev.sh mounts, with host dirs standing in for its
      # volumes. The gate itself is defined in scripts/gate.sh — the
      # single source for "what green means"; contributors run the
      # identical thing via ./dev.sh scripts/gate.sh.
      - name: Gate
        run: |
          mkdir -p .ci/cargo-registry .ci/target
          docker run --rm \
            -v "$PWD":/work -w /work \
            -v "$PWD/.ci/target":/target \
            -v "$PWD/.ci/cargo-registry":/usr/local/cargo/registry \
            pakeles-dev \
            scripts/gate.sh

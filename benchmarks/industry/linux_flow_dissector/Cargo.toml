[package]
name = "pakeles-benchmark-linux-flow-dissector"
version = "0.1.0"
edition = "2021"
publish = false
description = "Kernel-agreement example: flow keys vs the Linux flow dissector (projection + gate)"

[dependencies]
pakeles = { path = "../../../rust/pakeles" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
pakeles-testkit = { path = "../../../rust/pakeles-testkit" }

[package]
name = "pakeles-benchmark-quic-initial"
version = "0.1.0"
edition = "2021"
publish = false
description = "Incumbent-agreement example: QUIC v1 long header vs quiche (+ quinn-proto lane)"

[dependencies]
pakeles = { path = "../../../rust/pakeles" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
pakeles-testkit = { path = "../../../rust/pakeles-testkit" }

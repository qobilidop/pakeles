# The quic_initial golden factory: a standalone harness crate (NOT a
# member of the root workspace) that parses byte strings as QUIC
# packet headers via a pinned quiche (primary oracle) and quinn-proto
# (secondary, expected-divergence lane) and emits the two-lane golden.
# Unprivileged; runs in the normal dev container. Cargo.lock is
# COMMITTED — it is the incumbent pin the agreement claim cites.
[package]
name = "quic-initial-factory"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
quiche = { version = "=0.29.3", default-features = false }
quinn-proto = { version = "=0.11.16", default-features = false }
octets = { version = "=0.3.6", default-features = false }
bytes = "1"
serde_json = "1"
anyhow = "1"

[profile.release]
debug = false

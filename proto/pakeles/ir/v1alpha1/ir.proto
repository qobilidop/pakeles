// Pakeles IR: a serializable IR for wire-format parsers.
// This schema is the one normative artifact; every tool consumes or
// produces messages defined here. Expressions are operator trees —
// no syntax is ever smuggled inside strings.
syntax = "proto3";
package pakeles.ir.v1alpha1;

message Ir {
  // Schema revision (pre-1.0: consumers require an exact match and
  // refuse anything else; there is no cross-version compat promise).
  // 0.2.0: bit-uniform lengths — `bit_len` widths, region push
  // lengths, and `remaining()` are all denominated in BITS.
  string ir_version = 1;
  Parser parser = 2;
}

message Parser {
  string name = 1;
  repeated HeaderType header_types = 2;
  repeated State states = 3;
  string start_state = 4;
  // Mandatory global parse-depth bound (states entered). Boundedness is
  // what keeps the IR inside the decidable class; it is never optional.
  uint32 max_depth = 5;
  // Declared parse metadata: typed, read-write, initialized scalars.
  // Assignments may steer control flow (select keys) but can never
  // extend the max_depth budget.
  repeated MetadataField metadata = 6;
  map<string, string> annotations = 15;
}

message MetadataField {
  string name = 1;
  // Width in bits, 1..=64. Assignment truncates to this width (mod 2^bits);
  // reads zero-extend.
  uint32 bits = 2;
  // Initial value; must fit in `bits`. Defaults to 0.
  uint64 init = 3;
  Display display = 4;
  map<string, string> annotations = 15;
}

message HeaderType {
  string name = 1;
  repeated Field fields = 2;
  map<string, string> annotations = 15;
}

message Field {
  string name = 1;
  FieldWidth width = 2;
  // Presentation only — no execution path may branch on it.
  Display display = 3;
  map<string, string> annotations = 15;
}

// Typed presentation metadata. Explicitly non-semantic: interpreters
// and datapath backends ignore it entirely; dissector/doc backends
// consume it.
message Display {
  string name = 1;
  DisplayFormat format = 2;
  repeated ValueLabel value_labels = 3;
  string doc = 4;
}

enum DisplayFormat {
  DISPLAY_FORMAT_UNSPECIFIED = 0;
  DISPLAY_FORMAT_DEC = 1;
  DISPLAY_FORMAT_HEX = 2;
  DISPLAY_FORMAT_BIN = 3;
  DISPLAY_FORMAT_IPV4 = 4;
  DISPLAY_FORMAT_IPV6 = 5;
  DISPLAY_FORMAT_ETHER = 6;
}

message ValueLabel {
  uint64 value = 1;
  string label = 2;
}

message FieldWidth {
  // 0.1.0 carried `Expr byte_len = 2` (length in bytes); 0.2.0
  // re-denominated to bits under a fresh number so a stale binary IR
  // fails loudly ("no width") instead of silently re-reading bytes
  // as bits. The ir_version gate is the primary guard; this is the
  // belt to that suspender.
  reserved 2;
  reserved "byte_len";
  oneof width {
    // Fixed width in bits; big-endian (network order), MSB-first; <= 64.
    uint32 bits = 1;
    // Opaque bit run; length in BITS computed from prior fields. May
    // start and end at any bit offset — no alignment precondition.
    Expr bit_len = 3;
  }
}

message Expr {
  oneof kind {
    uint64 constant = 1;
    FieldRef field = 2;
    BinOp bin = 3;
    MetadataRef metadata = 4;
    // BITS between the cursor and the innermost sized region's end;
    // structural (no buffer clamp), legal only with a region open.
    // Legal as a select key and in assigns; NOT in bit_len widths or
    // push lengths (v1 — see docs/reference/ir-semantics.md, W4/W5).
    Remaining remaining = 5;
  }
}

message Remaining {}

message MetadataRef {
  string name = 1;
}

message FieldRef {
  string header = 1; // header *instance* name
  string field = 2;
}

message BinOp {
  BinOpKind op = 1;
  Expr lhs = 2;
  Expr rhs = 3;
}

enum BinOpKind {
  BIN_OP_KIND_UNSPECIFIED = 0;
  BIN_OP_KIND_ADD = 1;
  BIN_OP_KIND_SUB = 2;
  BIN_OP_KIND_MUL = 3;
  BIN_OP_KIND_SHL = 4;
  BIN_OP_KIND_SHR = 5;
  BIN_OP_KIND_AND = 6;
  BIN_OP_KIND_OR = 7;
}

message State {
  string name = 1;
  repeated Extract extracts = 2;
  Transition transition = 3;
  // Ordered metadata assignments, executed after this state's extracts
  // and before its transition. Total: no failure mode.
  repeated Assign assigns = 4;
  // Ordered sized-region ops, executed after assigns and before the
  // transition. Regions bound reads structurally (see the sized-region
  // design doc); they never affect the max_depth budget.
  repeated RegionOp region_ops = 5;
  map<string, string> annotations = 15;
}

message RegionOp {
  oneof kind {
    // Open a region of `push` BITS at the cursor (any alignment).
    // Structural check only: must fit the enclosing region, if any.
    Expr push = 1;
    // Close the innermost region; the cursor must sit exactly at its
    // end (exact-mode pop).
    Pop pop = 2;
  }
}

message Pop {}

message Assign {
  string metadata = 1; // must name a declared MetadataField
  Expr value = 2;
}

message Extract {
  string header_type = 1;
  string instance = 2; // defaults to header_type when empty
  // Peek: instantiate the header (bind fields, drive selects, appear
  // in the extracted-headers observables with true offsets) WITHOUT
  // advancing the cursor. Reads are checked exactly like an extract
  // (same region/input bounds, same reject classes — errors on short
  // input, matching P4's lookahead). v1: the peeked type must be
  // all-fixed-width (validator W9). This is P4-16 `lookahead<T>()` /
  // P4_14 `current(o, w)` as one flag on the existing op.
  bool lookahead = 3;
}

message Transition {
  oneof kind {
    Target direct = 1;
    Select select = 2;
  }
}

message Target {
  oneof kind {
    string state = 1;
    Accept accept = 2;
    Reject reject = 3;
  }
}

message Accept {}

message Reject {
  string reason = 1;
  // Recognized: "severity" = "error" (default) | "info". `info` marks
  // a payload boundary (e.g. unknown next protocol) — diagnose-mode
  // consumers render payload, not malformedness. Never semantic.
  map<string, string> annotations = 15;
}

message Select {
  repeated Expr keys = 1;
  repeated SelectArm arms = 2;
  Target default_target = 3;
}

message SelectArm {
  repeated KeysetEntry entries = 1; // one per key
  Target next = 2;
}

message KeysetEntry {
  oneof kind {
    uint64 value = 1;
    Masked masked = 2;
    Range range = 3;
  }
}

message Masked {
  uint64 value = 1;
  uint64 mask = 2;
}

message Range {
  uint64 lo = 1;
  uint64 hi = 2;
}

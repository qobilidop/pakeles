# Virtual workspace root: the repo root holds only language-neutral
# trees (proto/, examples/, testdata/, docs/, third_party/) plus the
# per-language surfaces rust/ and python/. The Rust toolchain crates
# live under rust/; each real-world gallery example is additionally its
# own crate so everything about one incumbent stays in one directory.
# A bare `cargo test` at the root runs every member — the whole gate.
[workspace]
resolver = "2"
members = [
    "rust/pakeles",
    "rust/pakeles-cli",
    "rust/pakeles-testkit",
    "rust/pakeles-pbgen",
    "examples/real_world/linux_flow_dissector",
    "examples/real_world/dpdk_ptype",
    "examples/real_world/katran_flow",
    "examples/real_world/sai_parser",
    "examples/real_world/tls_clienthello",
]
# The TLS golden factory is its own pinned-lockfile crate (the rustls
# pin IS the agreement claim) — never part of this workspace.
exclude = ["examples/real_world/tls_clienthello/factory"]

# Repo-wide Python lint config: covers python/ and the authoritative
# gallery descriptions in examples/<group>/<name>/<name>.py.
line-length = 88
extend-exclude = [
    "python/src/pakeles/_pb",  # vendored generated protobuf modules
    "**/gen",                  # generated artifacts
    ".claude",
    ".ci",                     # CI mounts its cargo caches inside the checkout
    "python/build",
    "python/dist",
    "third_party",
    "target",
]

[format]
# Everything is format-enforced except the gallery *descriptions*
# (the depth-pinned globs: examples/<name>/<name>.py and
# benchmarks/<group>/<name>/<name>.py), which keep deliberate
# vertical alignment in header classes — they are documents as much
# as code — and *.md, which keeps ruff away from fenced code blocks
# in README and the historical design docs. Factory/spike code under
# benchmarks/ is deeper than the globs and so IS formatted. Lint
# (below) covers all of it either way.
exclude = ["*.md", "examples/*/*.py", "benchmarks/*/*/*.py"]

[lint]
extend-select = ["I"]

[lint.isort]
# From the repo root ruff cannot infer first-party from the src
# layout; declare it (conftest = the tests' gallery loader).
known-first-party = ["pakeles", "conftest"]

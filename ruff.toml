# Repo-wide Python lint config: covers python/ and the authoritative
# gallery descriptions in examples/<group>/<name>/<name>.py.
line-length = 88
extend-exclude = [
    "python/src/pakeles/_pb",  # vendored generated protobuf modules
    "**/factory",              # incumbent-side capture scripts, not eDSL surface
    "**/spike",
    "**/gen",                  # generated artifacts
    ".claude",
    ".ci",                     # CI mounts its cargo caches inside the checkout
    "third_party",
    "target",
]

[format]
# Formatting is enforced only on the library (python/). The gallery
# descriptions (examples/, benchmarks/) keep deliberate vertical
# alignment in header classes — they are documents as much as code —
# and *.md keeps ruff away from fenced code blocks in README and the
# historical design docs. Lint (below) still covers all of them.
exclude = ["*.md", "examples/**", "benchmarks/**"]

[lint]
extend-select = ["I"]

[lint.isort]
# From the repo root ruff cannot infer first-party from the src
# layout; declare it (conftest = the tests' gallery loader).
known-first-party = ["pakeles", "conftest"]

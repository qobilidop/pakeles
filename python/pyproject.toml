[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pakeles"
version = "0.1.0"
description = "The Pakeles Python eDSL: parser descriptions authored in Python, emitted as the normative Pakeles IR"
requires-python = ">=3.10"
dependencies = ["protobuf>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# ruff and pyright are configured at the repo root (ruff.toml,
# pyrightconfig.json): they also cover the authoritative gallery
# descriptions under examples/, which live outside this project.
